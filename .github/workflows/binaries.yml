name: Build platform binaries

on:
  push:
    branches: [main]
    paths: ['core/**', 'decl/**', 'cli/**', 'ddp/**', 'mcp/**', 'npm/**', 'wasm/**', '.github/workflows/binaries.yml']
  workflow_dispatch:

env:
  MOONVIZ_VERSION: "0.1.6"
  # 不锁定工具链：历史锁定版目录会从下载 CDN 下架（403），latest 与
  # pages.yml 一致；wasm-gc/native 对小版本不敏感，产物以冒烟测试兜底。

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin-x64 不再构建：MoonBit 工具链已停止发布 Intel macOS 二进制
          # （install 脚本报 Unsupported platform），Intel Mac 走 bin.mjs 的
          # moon run 回退。
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          # 命名遵循 process.platform-process.arch（Windows 上是 win32）：
          # moonviz-mcp/bin.mjs 按该约定解析 moonviz-bin-<platform> 包
          - platform: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (latest, unix)
        if: runner.os != 'Windows'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Install MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
      # 全产物构建：native(cli+mcp) 平台相关 + 双 wasm 产物平台无关
      # （每个平台 job 都构建 wasm，互相 --clobber 校验一致性）
      - name: Build all artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version
          moon build --release --target native mcp
          moon build --release --target native cli
          moon build --release --target wasm-gc wasm
          moon build --release --target wasm wasm
          mkdir -p dist
          cp _build/native/release/build/mcp/mcp.exe dist/moonviz-mcp
          cp _build/native/release/build/cli/cli.exe dist/moonviz-cli
          cp _build/wasm-gc/release/build/wasm/wasm.wasm dist/moonviz-wasm-gc-${{ env.MOONVIZ_VERSION }}.wasm
          cp _build/wasm/release/build/wasm/wasm.wasm   dist/moonviz-wasm-classic-${{ env.MOONVIZ_VERSION }}.wasm
          file dist/*
      - name: Build all artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.moon\bin;$env:Path"
          moon version
          moon build --release --target native mcp
          moon build --release --target native cli
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item _build/native/release/build/mcp/mcp.exe dist/moonviz-mcp.exe
          Copy-Item _build/native/release/build/cli/cli.exe dist/moonviz-cli.exe
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n' \
            | _build/native/release/build/mcp/mcp.exe | grep -q '"serverInfo"'
          printf 'list-templates\nexit\n' \
            | _build/native/release/build/cli/cli.exe | grep -q '"login"'
          # 版本硬门（#9/#5 同类回归防线）：引擎自报 ENGINE_VERSION 必须
          # 等于 CI 命名基准 MOONVIZ_VERSION，不一致直接 fail 该 job
          printf 'exit\n' | _build/native/release/build/cli/cli.exe | head -1 \
            | grep -q "\"version\":\"${MOONVIZ_VERSION}\"" \
            || { echo "ENGINE_VERSION != MOONVIZ_VERSION (${MOONVIZ_VERSION})" >&2; exit 1; }
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}', 'exit' |
            &_build/native/release/build/mcp/mcp.exe | Select-String '"serverInfo"'
          'list-templates', 'exit' |
            &_build/native/release/build/cli/cli.exe | Select-String '"login"'
          # 版本硬门（#9）：ENGINE_VERSION 必须等于 MOONVIZ_VERSION
          $line = 'exit' | &_build/native/release/build/cli/cli.exe | Select-Object -First 1
          $want = '*"version":"' + $env:MOONVIZ_VERSION + '"*'
          if (($line -like $want) -eq $false) { throw "ENGINE_VERSION != MOONVIZ_VERSION ($env:MOONVIZ_VERSION): $line" }
      - name: Stage npm platform package (unix)
        if: runner.os != 'Windows'
        run: |
          PKG=npm/moonviz-bin-${{ matrix.platform }}
          mkdir -p "$PKG/bin"
          cp _build/native/release/build/mcp/mcp.exe "$PKG/bin/moonviz-mcp"
          cp _build/native/release/build/cli/cli.exe "$PKG/bin/moonviz-cli"
          chmod +x "$PKG/bin/moonviz-mcp" "$PKG/bin/moonviz-cli"
          cp LICENSE "$PKG/" 2>/dev/null || printf 'MIT License\n' > "$PKG/LICENSE"
          cat > "$PKG/package.json" <<EOF
          {
            "name": "moonviz-bin-${{ matrix.platform }}",
            "version": "${{ env.MOONVIZ_VERSION }}",
            "description": "Prebuilt MoonViz MCP server binary for ${{ matrix.platform }}. Installed automatically by moonviz-mcp — do not depend on this package directly.",
            "type": "module",
            "os": ["${{ startsWith(matrix.platform, 'darwin') && 'darwin' || 'linux' }}"],
            "cpu": ["${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}"],
            "files": ["bin", "README.md", "README.zh-CN.md", "LICENSE"],
            "license": "MIT",
            "repository": { "type": "git", "url": "git+https://github.com/asdshuaishuai/moonviz.git", "directory": "npm/moonviz-bin-${{ matrix.platform }}" }
          }
          EOF
          sed "s/darwin-arm64/${{ matrix.platform }}/" npm/moonviz-bin-darwin-arm64/README.md > "$PKG/README.md"
          sed "s/darwin-arm64/${{ matrix.platform }}/" npm/moonviz-bin-darwin-arm64/README.zh-CN.md > "$PKG/README.zh-CN.md"
          npm pack "./$PKG"
      - name: Stage npm platform package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pkg = "npm/moonviz-bin-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force "$pkg/bin" | Out-Null
          Copy-Item _build/native/release/build/mcp/mcp.exe "$pkg/bin/moonviz-mcp.exe"
          Copy-Item _build/native/release/build/cli/cli.exe "$pkg/bin/moonviz-cli.exe"
          Copy-Item LICENSE "$pkg/LICENSE"
          @'
          {
            "name": "moonviz-bin-${{ matrix.platform }}",
            "version": "${{ env.MOONVIZ_VERSION }}",
            "description": "Prebuilt MoonViz MCP server binary for ${{ matrix.platform }}. Installed automatically by moonviz-mcp — do not depend on this package directly.",
            "type": "module",
            "os": ["win32"],
            "cpu": ["x64"],
            "files": ["bin", "README.md", "README.zh-CN.md", "LICENSE"],
            "license": "MIT",
            "repository": { "type": "git", "url": "git+https://github.com/asdshuaishuai/moonviz.git", "directory": "npm/moonviz-bin-${{ matrix.platform }}" }
          }
          '@ | Set-Content "$pkg/package.json"
          Get-Content npm/moonviz-bin-darwin-arm64/README.md |
            ForEach-Object { $_ -replace 'darwin-arm64', '${{ matrix.platform }}' } |
            Set-Content "$pkg/README.md"
          Get-Content npm/moonviz-bin-darwin-arm64/README.zh-CN.md |
            ForEach-Object { $_ -replace 'darwin-arm64', '${{ matrix.platform }}' } |
            Set-Content "$pkg/README.zh-CN.md"
          npm pack "./$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: moonviz-bin-${{ matrix.platform }}
          path: moonviz-bin-*.tgz
      - name: Upload versioned wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonviz-wasm-${{ matrix.platform }}
          path: |
            dist/moonviz-wasm-gc-*.wasm
            dist/moonviz-wasm-classic-*.wasm

  # GitHub Releases 渠道：tag（engine-v*）或手动触发时，把全部平台
  # tarball 归档到 Release——分发不完全依赖 npm（win32-x64 曾被 npm
  # spam 风控拦截，GitHub 侧不受限）。
  gh-release:
    name: release tarballs to GitHub Releases
    needs: build
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/engine-v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create/refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag 触发时以 tag 名为准（如 engine-v0.1.1-fix），手动/分支触发
          # 回退到 MOONVIZ_VERSION 公式
          TAG="${{ github.ref_name }}"
          case "$TAG" in engine-v*) ;; *) TAG="engine-v${MOONVIZ_VERSION}";; esac
          NOTES="MoonViz engine ${TAG#engine-} — every artifact carries the same baseline version (single source: core/version.mbt ENGINE_VERSION, CI-gated against MOONVIZ_VERSION). Distribution channel is GitHub Releases only.
          \`\`\`
          Engine binaries (per platform, self-contained, libc only)
            moonviz-bin-darwin-arm64-<ver>.tgz   macOS Apple Silicon
            moonviz-bin-linux-x64-<ver>.tgz      Linux x64
            moonviz-bin-linux-arm64-<ver>.tgz    Linux arm64
            moonviz-bin-win32-x64-<ver>.tgz      Windows x64
              → each packs moonviz-cli (line-protocol CLI) + moonviz-mcp
                (stdio MCP server, 52 tools with inputSchema)

          WASM engines (platform-neutral, host-neutral)
            moonviz-wasm-gc-<ver>.wasm       wasm-gc + JS String Builtins;
                                             JS hosts (Node >= 22 / modern browsers)
            moonviz-wasm-classic-<ver>.wasm  standard WASM MVP, zero imports;
                                             wasmtime / wasmi / any spec runtime

          Integration packages (packed from this repo, stamped to <ver>)
            moonviz-engine-sdk-<ver>.tgz     Node SDK: stateless API + Session
                                             command-replay + DDP helpers
            moonviz-engine-wasm-<ver>.tgz    JS binding around the wasm-gc engine
                                             (createEngine; embeds dist/moonviz.wasm)
            moonviz-mcp-<ver>.tgz            MCP launcher: resolves the platform
                                             binary from moonviz-bin-* deps, zero compile
            moonviz-skill-<ver>.tgz          Agent skill spec (SKILL.md): fact-source
                                             discipline, tool/ops dictionary, gates
          \`\`\`"
          # 重建式发布：已存在则跳过 create（|| true），资产按名覆盖
          gh release create "$TAG" --title "MoonViz engine binaries ${TAG#engine-}"             --notes "$NOTES" --latest || true
          gh release upload "$TAG" moonviz-bin-*.tgz $(find . -name 'moonviz-wasm-*.wasm' | sed 's|^\./||') --clobber
          # 集成包从仓库状态打包（不镜像 npm registry——registry 停更即漂移），
          # 版本统一盖 MOONVIZ_VERSION 基线戳；wasm 绑定包内嵌本次构建的 wasm-gc
          WASM_GC=$(find . -name 'moonviz-wasm-gc-*.wasm' | head -1)
          ROOT="$PWD"
          for dir in sdk/node sdk/wasm npm/moonviz-skill npm/moonviz-mcp; do
            (
              cd "$dir" && npm pkg set version="${MOONVIZ_VERSION}"
              if [ "$dir" = "sdk/wasm" ]; then cp "$ROOT/$WASM_GC" dist/moonviz.wasm; fi
              npm pack --pack-destination "$ROOT"
            ) && echo "packed $dir @ ${MOONVIZ_VERSION}" || echo "PACK FAILED: $dir"
          done
          ls moonviz-engine-*.tgz moonviz-mcp-*.tgz moonviz-skill-*.tgz
          # 旧版本号残留资产清理：只保留与基线一致的命名
          for stale in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -v "${MOONVIZ_VERSION}" | grep -vE '^moonviz-bin-|^moonviz-wasm-'); do
            gh release delete-asset "$TAG" "$stale" -y && echo "removed stale asset $stale"
          done
          gh release upload "$TAG" moonviz-engine-sdk-*.tgz moonviz-engine-wasm-*.tgz moonviz-mcp-*.tgz moonviz-skill-*.tgz --clobber

  publish:
    name: publish platform packages (requires NPM_TOKEN)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish tarballs
        run: |
          set -e
          for tgz in moonviz-bin-*.tgz; do
            echo "publishing $tgz"
            npm publish "$tgz" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
