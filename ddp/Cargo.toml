[package]
name = "moonviz-ddp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MoonViz DDP encrypted document container codec"
repository = "https://github.com/asdshuaishuai/moonviz"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
