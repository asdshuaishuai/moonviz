name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'core/**', 'decl/**', 'wasm/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 构建 WASM-GC 引擎，供 playground 在浏览器本地运行
      # 不固定版本：固定版的 linux-x86_64 包在下载服务上可能缺失（403）；
      # wasm-gc 目标对工具链版本不敏感，latest 即可。
      - name: Install MoonBit toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Build wasm engine
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon build --target wasm-gc --release
          mkdir -p site/assets
          cp _build/wasm-gc/release/build/wasm/wasm.wasm site/assets/moonviz.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
