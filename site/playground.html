<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--tx:#1a1c1e;--tx2:#5b6470;--tx3:#9098a1;
  --acc:#4b6bfb;--ok:#1a9e5c;--err:#e05252;--line:#e3e6ec;
  font-family:-apple-system,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--panel:#1b1d21;--tx:#e8eaed;--tx2:#a8b0ba;--tx3:#6b7280;--line:#2c2f36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-size:13px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0;font-weight:700}
header .ver{font-size:11px;color:var(--tx3)}
header .spacer{flex:1}
header a{color:var(--tx2);font-size:12px;text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
select,textarea,input{font:inherit;color:var(--tx)}
select{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:8px;padding:4px 10px;font-size:12px;max-width:220px;cursor:pointer}
select:focus{outline:2px solid var(--acc);outline-offset:-1px}
option{background:var(--panel);color:var(--tx)}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;height:calc(100vh - 53px)}
.editor{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.preview{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.bar button:hover{border-color:var(--acc);color:var(--acc)}
.bar label{font-size:11px;color:var(--tx3)}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;padding:12px 14px;background:transparent;font:12px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:pre;overflow:auto}
#ops{height:110px;border-top:1px solid var(--line);font-size:12px}
.canvas{flex:1;overflow:auto;padding:22px;display:flex;gap:18px;align-items:flex-start;align-content:flex-start;justify-content:center;flex-wrap:wrap;background:var(--bg)}
.canvas:empty::before{content:'渲染后画板将显示在这里';color:var(--tx3);font-size:12px}
.canvas .shot{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);border-radius:6px;flex:0 0 auto;overflow:hidden;border:1px solid var(--line)}
.canvas .shot.on{border-color:var(--acc)}
.canvas .shot svg{display:block;max-height:min(72vh,760px);width:auto;max-width:min(60vw,560px);height:auto}
.shot h4{margin:0;padding:6px 10px;font-size:11px;color:var(--tx2);border-bottom:1px solid var(--line);background:var(--panel)}
.shot h4{margin:0;padding:6px 10px;font-size:11px;color:var(--tx2);border-bottom:1px solid var(--line)}
.status{padding:6px 14px;border-top:1px solid var(--line);font-size:11px;display:flex;gap:10px;align-items:center;min-height:30px}
.status .pill{padding:1px 9px;border-radius:99px;font-weight:700;font-size:10px;letter-spacing:.03em;flex:0 0 auto}
.pill.ok{background:rgba(26,158,92,.13);color:var(--ok)}
.pill.err{background:rgba(224,82,82,.13);color:var(--err)}
.pill.idle{background:rgba(144,152,161,.13);color:var(--tx3)}
#msg{color:var(--tx2)}
#msg.err{color:var(--err)}
.status button{margin-left:auto}
#msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tabbar{display:flex;gap:2px;padding:6px 12px 0}
.tabbar button{border:0;background:transparent;padding:5px 10px;font-size:12px;color:var(--tx3);border-radius:8px 8px 0 0}
.tabbar button.on{background:var(--bg);color:var(--tx);font-weight:700;box-shadow:inset 0 -2px 0 var(--acc)}
.hide{display:none!important}
#oplog{max-height:130px;overflow:auto;padding:6px 12px;border-top:1px solid var(--line);font:11px/1.7 ui-monospace,Menlo,monospace;color:var(--tx3)}
#oplog .e{color:var(--err)}
.ops-help{border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.ops-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ops-quick button,.chips button{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer}
.ops-quick button:hover,.chips button:hover{border-color:var(--acc);color:var(--acc)}
.ops-ids{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.lbl{font-size:10px;color:var(--tx3);font-weight:700;align-self:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips .ab{background:rgba(75,107,251,.10);color:var(--acc);font-weight:700}
#oplog .ok{color:var(--ok)}
.nosupport{padding:40px;text-align:center;color:var(--err);font-size:14px}
</style>

let statusTimer=null;
function setStatus(ok,msg){
  const p=$('pill'),m=$('msg');
  p.className='pill '+(ok===null?'idle':ok?'ok':'err');
  p.textContent=ok===null?'…':ok?'OK':'被拒';
  m.textContent=msg||'';
  m.className=ok===false?'err':'';
  p.title=ok===false?'操作被引擎门禁拒绝——不是崩溃：换参数后在操作台重试':'';
  clearTimeout(statusTimer);
  if(ok===false){statusTimer=setTimeout(()=>{if(p.className.includes('err')){p.className='pill idle';p.textContent='被拒';}},6000);}
}
function logOp(op,res){
  const row=document.createElement('div');
  const ok=res.ok===true;
  row.className=ok?'':'e';
  row.textContent=`> ${op}  ${ok?'✓ '+(res.revision!==undefined?'rev '+res.revision:''):'✗ '+(res.error||'')}`;
  $('oplog').prepend(row);
}
function showTab(w){
  $('tab-src').classList.toggle('on',w==='src');
  $('tab-ops').classList.toggle('on',w==='ops');
  $('src').classList.toggle('hide',w!=='src');
  $('ops-wrap').classList.toggle('hide',w!=='ops');
  (w==='src'?$('src'):$('ops')).focus();
}
function artboards(){const r=lastRender();return (r&&r.artboards)||[];}
let lastResult=null;
function lastRender(){return lastResult;}
/// 操作台辅助：真实 id 芯片 + 快捷命令
function refreshIdChips(abs){
  const box=$('idchips');if(!box)return;
  box.innerHTML='';
  if(!abs.length){box.innerHTML='<span style="font-size:11px;color:var(--tx3)">（空文档 — 先从上方选模板）</span>';return;}
  abs.forEach(a=>{
    const b=document.createElement('button');
    b.className='ab';b.textContent=a.id;b.title='画板';
    b.onclick=()=>insertToken(a.id);
    box.appendChild(b);
    (a.nodes||[]).slice(0,14).forEach(n=>{
      if(!n.id)return;
      const nb=document.createElement('button');
      nb.textContent=n.id;nb.title=(n.text||n.id).slice(0,24);
      nb.onclick=()=>insertToken(n.id);
      box.appendChild(nb);
    });
  });
}
function insertToken(t){
  const el=$('ops');
  const cur=el.value;
  el.value=cur?cur.replace(/\s+$/,'')+' '+t+' ':t+' ';
  el.focus();
}
function firstAb(){
  const a=artboards();if(!a.length)return null;
  return a.find(x=>(x.nodes||[]).length>0)||a[0];
}
function firstNode(ab){const ns=(ab&&ab.nodes)||[];return ns.length?ns[0]:null;}
function quickCmd(kind){
  const ab=firstAb();if(!ab){setStatus(false,'先载入模板或写入源码');return;}
  const n=firstNode(ab);
  const abid=ab.id,nid=n?n.id:'';
  const cmds={
    recolor:n?`update ${abid} ${nid} fill=#FF7A45`:null,
    rename:n?`update ${abid} ${nid} text=Hello MoonViz`:null,
    flow:n?`flow ${abid} ${abid} ${nid}`:null,
    hide:n?`update ${abid} ${nid} visible=false`:null,
    responsive:`responsive ${abid}`,
  };
  const cmd=cmds[kind];
  if(!cmd){setStatus(false,'当前画板没有可操作节点');return;}
  $('ops').value=cmd;
  applyOp();
}
document.querySelectorAll('.ops-quick button[data-op]').forEach(b=>{
  b.addEventListener('click',()=>quickCmd(b.dataset.op));
});

function downloadSvg(){
  const abs=artboards();if(!abs.length){toastMsg('无可导出的画板');return;}
  const a=abs[Math.min(artIndex,abs.length-1)];
  const blob=new Blob([a.svg],{type:'image/svg+xml'});
  const el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download=(a.id||'artboard')+'.svg';el.click();
  URL.revokeObjectURL(el.href);
}
function toastMsg(m){setStatus(true,m);}

function render(){
  if(!engine)return;
  try{
    const r=engine.render(mbt);
    lastResult=r;
    if(!r.ok){setStatus(false,r.error||'render failed');return;}
    const abs=r.artboards||[];
    artIndex=Math.min(artIndex,Math.max(0,abs.length-1));
    const c=$('canvas');c.innerHTML='';
    refreshIdChips(abs);
    abs.forEach((a,i)=>{
      const d=document.createElement('div');d.className='shot';
      d.innerHTML=`<h4>${a.id} · ${a.width}×${a.height}${i===artIndex?' · 当前':''}</h4>${a.svg}`;
      d.className='shot'+(i===artIndex?' on':'');
      d.onclick=()=>{artIndex=i;render();};
      c.appendChild(d);
    });
    if(!abs.length){c.innerHTML='<div style="color:var(--tx3)">空文档 — 在左侧选一个模板，或在操作台执行 template &lt;id&gt; &lt;name&gt;</div>';}
    const rev=r.revision!==undefined?`rev ${r.revision}`:'';
    setStatus(true,`渲染成功 · ${abs.length} 画板 · ${rev}`);
  }catch(e){setStatus(false,String(e.message||e));}
}
function applySource(){mbt=$('src').value;render();}
function validate(){
  if(!engine)return;
  const v=engine.validate(mbt);
  setStatus(v.ok===true, v.ok?`校验通过 · entry ${v.entry||'-'} · rev ${v.revision??'-'}`:(v.error||'校验失败'));
}
function applyOp(){
  const op=$('ops').value.trim();if(!op)return;
  try{
    const r=engine.apply_agent_op(mbt,op);
    logOp(op,r);
    if(r.ok===true&&r.mbt){
      mbt=r.mbt;$('src').value=mbt;artIndex=0;render();
      $('ops').value='';
    }else{
      const e=r.error||'操作被拒绝';
      let hint='';
      if(e.includes('unknown_artboard')||e.includes('unknown_node'))hint=' — 请用上方芯片里的真实 id';
      else if(e.includes('mbt_gate_block'))hint=' — 门禁拦截（该修改会破坏设计约束，如重叠/越界）：换个节点或改小数值重试';
      setStatus(false,e+hint);
    }
  }catch(e){setStatus(false,String(e.message||e));}
}
$('ops').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyOp();}
});
$('src').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();applySource();}
});
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
$('render-btn').textContent='渲染 '+(isMac?'⌘↵':'Ctrl↵');
async function loadTemplates(){
  try{
    const t=engine.list_templates();const arr=JSON.parse(t);
    $('tpl').innerHTML='<option value="">选择模板…</option>'+
      arr.map(x=>`<option value="${x.id}">${x.name}（${x.id}）</option>`).join('');
  }catch(_){$('tpl').innerHTML='<option value="">模板不可用</option>';}
}
$('tpl').addEventListener('change',e=>{
  const id=e.target.value;if(!id)return;
  try{
    let base=mbt.trim()?mbt:MINIMAL;
    let r=engine.apply_agent_op(base, `template ${id} demo`);
    if(r.ok!==true||!r.mbt){setStatus(false,r.error||'模板载入失败');e.target.value='';return;}
    let doc=r.mbt;
    // 存根起步时清掉空存根画板，避免预览/芯片里残留无节点的占位画板
    const abs=(r.artboards||[]).filter(a=>(a.nodes||[]).length===0).map(a=>a.id);
    for(const dead of abs){
      const r2=engine.apply_agent_op(doc, `delete-artboard ${dead}`);
      if(r2.ok===true&&r2.mbt)doc=r2.mbt;
    }
    mbt=doc;$('src').value=mbt;artIndex=0;render();setStatus(true,'模板已载入：'+id);
  }catch(err){setStatus(false,String(err.message||err));}
  e.target.value='';
});

async function boot(){
  if(!(typeof WebAssembly==='object')||!WebAssembly.instantiate){
    document.body.innerHTML='<div class="nosupport">此浏览器不支持 WebAssembly。</div>';return;
  }
  try{
    const res=await fetch('assets/moonviz.wasm');
    if(!res.ok)throw new Error('moonviz.wasm 加载失败（HTTP '+res.status+'）');
    const bytes=await res.arrayBuffer();
    const mod=new WebAssembly.Module(bytes,{builtins:['js-string'],importedStringConstants:'_'});
    const exports=new WebAssembly.Instance(mod,{}).exports;
    engine={
      version:()=>JSON.parse(exports.version_info()),
      render:s=>JSON.parse(exports.render_mbt(s)),
      validate:s=>JSON.parse(exports.validate_mbt(s)),
      apply_agent_op:(s,o)=>JSON.parse(exports.apply_agent_op(s,o)),
      list_templates:()=>exports.list_templates(),
    };
    const v=engine.version();
    $('ver').textContent='engine '+v.engine+' v'+v.version+' · wasm-gc · 全程本地运行';
    mbt=EXAMPLE;$('src').value=mbt;
    await loadTemplates();
    render();
    setStatus(null,'就绪 — 编辑源码后点渲染，或切到操作台用快捷按钮试试');
  }catch(e){
    const m=String(e.message||e);
    if(m.includes('js-string')||m.includes('string constants')||m.includes('Import #0')){
      document.body.innerHTML='<div class="nosupport">此浏览器/运行时尚不支持 WASM GC 与 JS String Builtins。<br>请使用 Chrome 119+ / Firefox 120+ / Safari 18.2+ / Edge 119+。</div>';
    }else{
      document.body.innerHTML='<div class="nosupport">引擎加载失败：'+m+'</div>';
    }
  }
}
boot();
</script>
