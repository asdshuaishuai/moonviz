<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · MoonViz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--tx:#1a1c1e;--tx2:#5b6470;--tx3:#9098a1;
  --acc:#4b6bfb;--ok:#1a9e5c;--err:#e05252;--line:#e3e6ec;
  font-family:-apple-system,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--panel:#1b1d21;--tx:#e8eaed;--tx2:#a8b0ba;--tx3:#6b7280;--line:#2c2f36}}
*{box-sizing:border-box}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 炫酷层：极光 / 蚂蚁线 / 旋转描边 / 编排入场 / 微交互 ===== */
/* 极光画布：三团慢漂移的品牌色辉光（画布最底层） */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;filter:blur(46px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:420px;height:420px;left:-8%;top:-12%;background:radial-gradient(circle,#4b6bfb 0%,transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:360px;height:360px;right:-6%;bottom:-10%;background:radial-gradient(circle,#9d7bff 0%,transparent 65%);animation:drift2 31s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:300px;height:300px;left:38%;top:46%;background:radial-gradient(circle,#3ad2b5 0%,transparent 65%);opacity:.5;animation:drift3 37s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.25)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.15)}to{transform:translate(-100px,-70px) scale(.9)}}
@keyframes drift3{from{transform:translate(0,0)}to{transform:translate(-70px,90px) scale(1.2)}}
.canvaswrap>.canvas{position:relative;z-index:1}

/* 蚂蚁线选框：SVG 描边动画 */
#selbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#selbox svg rect{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 5;animation:ants .6s linear infinite}
@keyframes ants{to{stroke-dashoffset:-11}}

/* 活动画板：旋转渐变描边 */
.shot.on{position:relative}
.shot.on::after{content:'';position:absolute;inset:-2px;border-radius:9px;padding:1.5px;background:conic-gradient(from var(--ga,0deg),#4b6bfb,#9d7bff,#3ad2b5,#4b6bfb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin-g 3.2s linear infinite;pointer-events:none}
@property --ga{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin-g{to{--ga:360deg}}

/* 卡片编排入场 */
.shot.enter{animation:rise .45s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

/* 债徽章呼吸 */
.debt.some{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 6px rgba(230,150,20,.2)}50%{box-shadow:0 0 16px rgba(230,150,20,.55)}}

/* 主按钮扫光 */
button.pri{position:relative;overflow:hidden}
button.pri::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .45s ease}
button.pri:hover::before{left:130%}
button:active{transform:scale(.96)}
button{transition:all .16s ease}

/* 状态消息弹入 */
#msg.pop{animation:msgin .3s ease}
@keyframes msgin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 图层滑入 */
.lay{animation:layin .25s ease backwards}
.lay:nth-child(1){animation-delay:.02s}.lay:nth-child(2){animation-delay:.045s}.lay:nth-child(3){animation-delay:.07s}
.lay:nth-child(4){animation-delay:.095s}.lay:nth-child(5){animation-delay:.12s}.lay:nth-child(6){animation-delay:.145s}
.lay:nth-child(7){animation-delay:.17s}.lay:nth-child(8){animation-delay:.19s}.lay:nth-child(n+9){animation-delay:.21s}
@keyframes layin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* toast 弹跳 */
#toast{transform:translateX(-50%) translateY(14px) scale(.92)}
#toast.show{transform:translateX(-50%) translateY(0) scale(1);transition:all .3s cubic-bezier(.2,1.4,.4,1)}

/* 品牌脉冲点 */
#branddot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#6a8bff,#9d7bff);box-shadow:0 0 8px rgba(108,131,255,.8);animation:beat 2.4s ease-in-out infinite;flex:0 0 auto}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.65}}

/* 启动加载层 */
#bootlayer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .4s ease}
#bootlayer.off{opacity:0;pointer-events:none}
.bootring{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite}
.bootring::after{content:''}
@keyframes spin{to{transform:rotate(360deg)}}
#bootlayer p{margin:0;font-size:12.5px;color:var(--tx2);letter-spacing:.06em}

/* 面板编辑器标签动效 */
.tabbar button.on{animation:tabin .25s ease}
@keyframes tabin{from{opacity:.4}to{opacity:1}}

/* 语法高亮层渐显 */
.edwrap>#hl{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* 降低动效偏好 */
@media (prefers-reduced-motion:reduce){
  .aurora i,.shot.on::after,.debt.some,#branddot,.bootring{animation:none!important}
  .shot.enter,.lay,#msg.pop,.shot.themed .dframe{animation:none!important}
}
body{margin:0;background:var(--bg);color:var(--tx);font-size:13px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:9px 16px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:relative;z-index:5}
header h1{font-size:14.5px;margin:0;font-weight:800;background:linear-gradient(120deg,#6a8bff,#4b6bfb 40%,#9d7bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.01em}
header .ver{font-size:11px;color:var(--tx3)}
header .spacer{flex:1}
header a{color:var(--tx2);font-size:12px;text-decoration:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
select,textarea,input{font:inherit;color:var(--tx)}
select{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:8px;padding:4px 10px;font-size:12px;max-width:230px;cursor:pointer}
select:focus{outline:2px solid var(--acc);outline-offset:-1px}
option{background:var(--panel);color:var(--tx)}
main{display:grid;grid-template-columns:minmax(330px,36%) 1fr 252px;height:calc(100vh - 50px)}
/* 原型模式：单栏全宽舞台（Axure 玩家形态） */
body.mode-proto main{grid-template-columns:1fr}
@media (max-width:1080px){body.mode-proto main{grid-template-columns:1fr}}
@media (max-width:1080px){main{grid-template-columns:minmax(300px,42%) 1fr}}
.editor{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.canvaswrap{display:flex;flex-direction:column;min-width:0;position:relative}
.inspector{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (max-width:1080px){.inspector{display:none}}
.bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.bar button:hover{border-color:var(--acc);color:var(--acc)}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;padding:12px 14px;background:transparent;font:12px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.edwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.edwrap>#hl{position:absolute;inset:0;margin:0;padding:12px 14px;font:12px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:pre;overflow:hidden;pointer-events:none;color:var(--tx2)}
.edwrap>#hl code{display:block;min-height:100%}
.edwrap>textarea{position:relative;z-index:1;color:transparent;caret-color:var(--acc);background:transparent;flex:1}
.edwrap>textarea::selection{background:rgba(75,107,251,.25)}
/* 语法色板（随主题自适应） */
.t-com{color:var(--tx3);font-style:italic}
.t-key{color:#c678dd}
.t-str{color:#98c379}
.t-num{color:#d19a66}
.t-fn{color:#61afef}
.t-ann{color:#e5c07b}
.t-yk{color:#61afef}
.t-head{color:var(--acc);font-weight:700}
.t-fence{color:var(--tx3);background:rgba(128,128,128,.07)}
.t-pun{color:var(--tx3)}
.t-tag{color:#e06c75}
@media (prefers-color-scheme:light){
  .t-key{color:#a626a4}.t-str{color:#50a14f}.t-num{color:#986801}
  .t-fn{color:#4078f2}.t-ann{color:#b76b01}.t-yk{color:#0184bc}.t-tag{color:#e45649}
}
#ops{height:150px;border-top:1px solid var(--line);font-size:12px}
.tabbar{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--line)}
.tabbar button{border:0;background:transparent;padding:6px 12px;font-size:12px;color:var(--tx3);border-radius:8px 8px 0 0;font-weight:600}
.tabbar button{transition:color .15s}
.tabbar button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
button,.bpSw button,.themes button{transition:all .15s ease}
.hide{display:none!important}
#oplog{max-height:120px;overflow:auto;padding:6px 12px;border-top:1px solid var(--line);font:11px/1.7 ui-monospace,Menlo,monospace;color:var(--tx3)}
#oplog .e{color:var(--err)}
#oplog .ok{color:var(--ok)}
.canvas{flex:1;overflow:auto;padding:26px;display:flex;gap:18px;align-items:flex-start;align-content:flex-start;justify-content:center;flex-wrap:wrap;position:relative;
  background-color:var(--bg);
  background-image:
    radial-gradient(600px 320px at 18% 8%,rgba(75,107,251,.07),transparent 60%),
    radial-gradient(520px 300px at 85% 90%,rgba(157,123,255,.06),transparent 60%),
    radial-gradient(circle,var(--line) 1px,transparent 1px);
  background-size:auto,auto,18px 18px}
.canvas:empty::before{content:'渲染后画板将显示在这里';color:var(--tx3);font-size:12px}
.shot{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.06);border-radius:8px;flex:0 0 auto;overflow:hidden;border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.shot:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.13)}
.shot.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 4px 20px rgba(75,107,251,.18)}
.shot svg{display:block}
.shot svg g[id^="n_"]{cursor:move}
/* ── 设备舞台：手机/bezel 与 浏览器/chrome，随画板宽高比自动选择 ── */
.dframe{position:relative;border-radius:10px;background:#fff}
.shot.dev{background:transparent;border-color:transparent;box-shadow:0 24px 60px -14px rgba(15,18,28,.42),0 6px 20px rgba(15,18,28,.16)}
.shot.dev:hover{box-shadow:0 30px 72px -14px rgba(15,18,28,.5),0 8px 24px rgba(15,18,28,.2)}
.dphone{border-radius:44px;padding:11px;background:linear-gradient(160deg,#2a2f3a,#12151c 42%,#252b36);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),inset 0 2px 18px rgba(0,0,0,.55)}
.dphone svg{border-radius:34px;display:block}
.island{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:86px;height:24px;border-radius:14px;background:#0a0c10;z-index:2;box-shadow:inset 0 0 4px rgba(255,255,255,.07)}
.dbrowser{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.dbrowser .chrome{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:linear-gradient(#f4f5f7,#e9ebef);border-bottom:1px solid var(--line)}
.dbrowser .chrome i{width:10px;height:10px;border-radius:50%;background:#ff5f57;flex:0 0 auto}
.dbrowser .chrome i:nth-child(2){background:#febc2e}
.dbrowser .chrome i:nth-child(3){background:#28c840}
.dbrowser .chrome em{font-style:normal;color:var(--tx3);margin-left:8px;background:rgba(255,255,255,.85);border-radius:99px;padding:3px 14px;font-size:10px;flex:1;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── 画板名浮签（替代旧 h4 头）── */
.shot{position:relative}
.shot .tag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--tx2);font:600 10.5px/1 ui-monospace,Menlo,monospace;padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.shot .tag:hover{border-color:var(--acc);color:var(--acc);transform:translateX(-50%) translateY(-1px)}
/* ── 焦点层次：非当前画板退后 ── */
.shot:not(.on){opacity:.78;filter:saturate(.85)}
.shot:not(.on):hover{opacity:1;filter:none}
/* ── 主题切换涟漪 ── */
.shot.themed .dframe{animation:themeflash .75s ease}
@keyframes themeflash{0%{filter:brightness(1.35) saturate(1.55)}55%{filter:brightness(1.07)}100%{filter:none}}
/* ── 缩放控制条 ── */
/* ── 双模式：原型（默认，给人看的 Axure 式玩家）/ 源码（二级，编辑与 Agent 门槛）── */
body.mode-proto .editor,body.mode-proto .inspector,body.mode-proto #canvas,
body.mode-proto #playbar,body.mode-proto #undobtn,body.mode-proto #playBtn,
body.mode-proto #retryBtn{display:none}
body.mode-src #protobar,body.mode-src #stage{display:none}
#modesw{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:99px;margin-left:12px}
#modesw button{border:none;background:transparent;color:var(--tx2);padding:3px 14px;border-radius:99px;cursor:pointer;font-size:12px}
#modesw button.on{background:var(--acc);color:#fff}
header select#tpl{max-width:180px;font-size:12px;padding:3px 8px;margin-left:10px}
header .themes{margin-left:8px}
#protobar{position:relative;z-index:2;display:flex;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#proto-back{font-size:12px;padding:3px 14px}
#proto-back:disabled{opacity:.4;cursor:default}
#ab-pills{display:flex;gap:4px;flex-wrap:wrap}
#ab-pills button{font-size:11px;padding:3px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer}
#ab-pills button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;z-index:1}
#stage .shot{max-height:none}
.stage-empty{color:var(--tx3);font-size:13px}
#zoombar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:3px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.12)}
#zoombar button{width:32px;height:26px;border:none;background:transparent;color:var(--tx2);border-radius:99px;cursor:pointer;font-size:14px;line-height:1;padding:0}
#zoombar #zoomv{width:54px;font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
#zoombar button:hover{background:var(--acc);color:#fff}
#selbox{position:absolute;border:1.5px solid var(--acc);border-radius:3px;pointer-events:none;display:none;box-shadow:0 0 0 1px rgba(75,107,251,.2),0 0 14px rgba(75,107,251,.3);transition:box-shadow .15s}
#seltag{position:absolute;background:var(--acc);color:#fff;font-size:10px;padding:1px 7px;border-radius:4px 4px 4px 0;transform:translateY(-100%);white-space:nowrap}
.status{padding:6px 14px;border-top:1px solid var(--line);font-size:11px;display:flex;gap:10px;align-items:center;min-height:30px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.debt.some{box-shadow:0 0 10px rgba(230,150,20,.25)}
.status .pill{padding:1px 9px;border-radius:99px;font-weight:700;font-size:10px;letter-spacing:.03em;flex:0 0 auto}
.pill.ok{background:rgba(26,158,92,.13);color:var(--ok)}
.pill.err{background:rgba(224,82,82,.13);color:var(--err)}
.pill.idle{background:rgba(144,152,161,.13);color:var(--tx3)}
#msg{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#msg.err{color:var(--err)}
.status button{margin-left:auto}
.ops-help{border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.ops-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ops-quick button,.chips button{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer}
.ops-quick button:hover,.chips button:hover{border-color:var(--acc);color:var(--acc)}
.ops-ids{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.lbl{font-size:10px;color:var(--tx3);font-weight:700;align-self:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips .ab{background:rgba(75,107,251,.10);color:var(--acc);font-weight:700}
.gram-body{flex:1;overflow:auto;padding:12px 14px}
.gram-tip{margin:0 0 10px;font-size:11.5px;color:var(--tx3)}
.gram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px}
.gram-cat h5{margin:0 0 5px;font-size:10.5px;color:var(--acc);font-weight:700;letter-spacing:.03em}
.gram-cat .g{font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--tx2);padding:3px 7px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gram-cat .g:hover{background:rgba(75,107,251,.08);color:var(--acc)}
.gram-cat .g::before{content:'▸ ';color:var(--tx3)}
.insp-hd{padding:8px 12px;font-size:11px;font-weight:700;color:var(--tx3);border-bottom:1px solid var(--line);letter-spacing:.04em}
#layers{flex:0 0 auto;max-height:34%;overflow:auto;padding:4px 6px;border-bottom:1px solid var(--line)}
.lay{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-size:11.5px;color:var(--tx2);cursor:pointer;white-space:nowrap;overflow:hidden}
.lay:hover{background:rgba(75,107,251,.06)}
.lay.on{background:rgba(75,107,251,.12);color:var(--acc);font-weight:700}
.lay .k{font-size:9.5px;color:var(--tx3);margin-left:auto;flex:0 0 auto}
#props{flex:1;overflow:auto;padding:10px 12px}
.pcard{margin-bottom:10px}
.pcard .pid{font-size:12px;font-weight:700;color:var(--tx)}
.pcard .pkind{font-size:10px;color:var(--tx3)}
.prow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;margin-top:7px}
.prow label{font-size:10px;color:var(--tx3);font-weight:700}
.prow input,.prow3 input{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:6px;padding:3px 7px;font-size:11.5px}
.prow input:focus,.prow3 input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.prow3 .colorpair input[type=text]{flex:1}
input[type=color]{-webkit-appearance:none;appearance:none;width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;flex:0 0 auto}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}

/* ---------- 双语法高亮：markdown + moonbit ---------- */
const escH=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MBT_KW=/\b(fn|let|mut|match|if|else|return|pub|struct|enum|test|for|in|while|continue|break|type|Some|None|Ok|Err|true|false|Unit)\b/g;
function hlMbtLine(l){
  // 整行注释（///| 文档注释与普通 //）
  const dc=l.indexOf('///|'),nc=l.indexOf('//');
  if(dc===0)return '<span class="t-ann">'+escH(l)+'</span>';
  if(nc===0)return '<span class="t-com">'+escH(l)+'</span>';
  let out='',rest=l,done='';
  // 先按字符串切分，字符串外的部分做关键词/数字/注解高亮
  const re=/"(?:[^"\\]|\\.)*"/g;let last=0,m;
  while((m=re.exec(l))!==null){
    out+=codeSpan(l.slice(last,m.index));
    out+='<span class="t-str">'+escH(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  out+=codeSpan(l.slice(last));
  return out;
  function codeSpan(t){
    if(!t)return '';
    // 行内注释
    const ci=t.indexOf('//');
    if(ci>=0)return codeCore(t.slice(0,ci))+'<span class="t-com">'+escH(t.slice(ci))+'</span>';
    return codeCore(t);
  }
  function codeCore(t){
    let r=escH(t);
    r=r.replace(MBT_KW,'<span class="t-key">$1</span>');
    r=r.replace(/(@[a-z_][\w.]*)/g,'<span class="t-ann">$1</span>');
    r=r.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="t-num">$1</span>');
    r=r.replace(/\b([a-z_][\w]*)\s*(?=\()/g,'<span class="t-fn">$1</span>');
    return r;
  }
}
function hlYamlLine(l){
  const m=/^(\s*[\w-]+):(.*)$/.exec(l);
  if(!m)return escH(l);
  return '<span class="t-yk">'+escH(m[1])+'</span><span class="t-pun">:</span>'+hlYamlVal(m[2]);
}
function hlYamlVal(v){
  let r=escH(v);
  r=r.replace(/(&quot;[^&]*?&quot;|"[^"]*")/g,'<span class="t-str">$1</span>');
  r=r.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="t-num">$1</span>');
  return r;
}
function hlMdLine(l){
  if(/^#{1,6}\s/.test(l))return '<span class="t-head">'+escH(l)+'</span>';
  if(/^<!--/.test(l)||/-->\s*$/.test(l))return '<span class="t-tag">'+escH(l)+'</span>';
  let r=escH(l);
  r=r.replace(/(`[^`]+`)/g,'<span class="t-str">$1</span>');
  r=r.replace(/(\*\*[^*]+\*\*)/g,'<span class="t-head">$1</span>');
  return r;
}
function highlight(src){
  const lines=src.split('\n');
  let mode='md';
  const out=[];
  for(const line of lines){
    const t=line.trim();
    if(mode==='md'&&t==='---'){mode='fm';out.push('<span class="t-pun">---</span>');continue;}
    if(mode==='fm'&&t==='---'){mode='md';out.push('<span class="t-pun">---</span>');continue;}
    if(mode==='md'&&t.startsWith('```')){mode='mbt';out.push('<span class="t-fence">'+escH(line)+'</span>');continue;}
    if(mode==='mbt'&&t.startsWith('```')){mode='md';out.push('<span class="t-fence">'+escH(line)+'</span>');continue;}
    if(mode==='fm'){out.push(hlYamlLine(line));continue;}
    if(mode==='mbt'){out.push(hlMbtLine(line));continue;}
    out.push(hlMdLine(line));

function firstAb(){const a=artboards();return a.find(x=>(x.nodes||[]).length>0)||a[0]||null;}

function render(){
  if(!engine)return;
  try{
    const r=engine.render(mbt);
    lastResult=r;
    if(!r.ok){setStatus(false,r.error||'render failed');return;}
    const abs=r.artboards||[];
    if(artIndex>=abs.length)artIndex=0;
    if(selNode&&!nodeOf(selNode))selNode=null;
    if(mode==='proto'){
      renderStage();
      if(abs.length)setStatus(true,`原型 · ${abs[artIndex].id}${r.revision!==undefined?' · rev '+r.revision:''}${r.debt?' · 债 '+r.debt:''}`);
      else setStatus(null,'空文档 — 从模板新建一个画板');
      return;
    }
    const c=$('canvas');c.innerHTML='';
    abs.forEach((a,i)=>{
      const d=document.createElement('div');d.className='shot enter'+(i===artIndex?' on':'');
      d.style.animationDelay=(i*70)+'ms';
      d.addEventListener('animationend',()=>d.classList.remove('enter'),{once:true});
      const phone=a.width>=320&&a.height>=560&&(a.height/a.width)>=1.35;
      const browser=a.width>=560&&(a.width/a.height)>=1.15;
      if(phone||browser)d.classList.add('dev');
      d.innerHTML=`<div class="dframe ${phone?'dphone':browser?'dbrowser':''}">${
        phone?'<span class="island"></span>':
        browser?`<span class="chrome"><i></i><i></i><i></i><em>${a.id}</em></span>`:''
      }${a.svg}</div><button class="tag">${a.id} · ${a.width}×${a.height}</button>`;
      d.querySelector('.tag').onclick=(ev)=>{ev.stopPropagation();artIndex=i;render();};
      c.appendChild(d);
    });
    applyZoom();
    if(!abs.length){c.innerHTML='';setStatus(null,'空文档 — 从模板新建或在源码里写内容');}
    refreshIdChips(abs);renderLayers();renderProps();placeSelbox();
    if(abs.length){
      const rev=r.revision!==undefined?`rev ${r.revision}`:'';
      const debt=r.debt?` · 视觉债 ${r.debt}`:'';
      setStatus(true,`当前画板 ${abs[artIndex].id}${rev}${debt}`);
    }

}
/* ---------- 画布缩放：按 SVG 原始宽高 × zoom 设定 style 尺寸（布局级缩放，拖拽/选区几何天然正确） ---------- */

  });

}
function zoomBy(d){zoom=Math.min(2,Math.max(.35,zoom+d));applyZoom();}
function zoomFit(){

/* ---------- 人类行为：画布选中 / 拖拽 / 属性（HumanGate） ---------- */
function humanOp(op,silentOk){
  if(!engine)return false;
  pushHistory();
  try{
    const r=engine.apply_human_op(mbt,op);
    if(r.ok===true&&r.mbt){
      mbt=r.mbt;$('src').value=mbt;render();
      if(!silentOk)setStatus(true,`✓ ${op.split(' ').slice(0,2).join(' ')}（HumanGate${r.debt?` · 债 ${r.debt}`:''}）`);
      return true;

function placeSelbox(){
  const box=$('selbox'),tag=$('seltag');

/* 拖拽：SVG 坐标换算 + ghost 位移 + 释放提交 HumanGate move */
let drag=null;
$('canvas').addEventListener('mousedown',e=>{
  if(mode!=='src'||playing)return; // 原型模式纯观看：点击走 playTap；编辑仅限源码模式
  const g=e.target.closest&&e.target.closest('g[id^="n_"]');
  if(!g)return;
  const svg=g.ownerSVGElement;
  const id=g.id.slice(2);
  const n=nodeOf(id);
  if(!n||!svg)return;
  e.preventDefault();
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
  drag={g,svg,id,n,startX:loc.x,startY:loc.y,origX:n.rect.x,origY:n.rect.y,moved:false};
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const pt=drag.svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const loc=pt.matrixTransform(drag.svg.getScreenCTM().inverse());
  const dx=loc.x-drag.startX, dy=loc.y-drag.startY;
  if(!drag.moved&&Math.hypot(dx,dy)<3)return;
  drag.moved=true;
  drag.g.setAttribute('transform',`translate(${dx},${dy})`);
  $('selbox').style.display='none';
});
window.addEventListener('mouseup',()=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(d.moved){
    const cur=activeSvg();
    const g=cur?cur.querySelector(`g[id="n_${d.id}"]`):null;
    const tr=g?g.getAttribute('transform'):null;
    if(g&&tr)g.removeAttribute('transform');
    const m=tr&&/\(([-\d.]+),([-\d.]+)\)/.exec(tr);
    const dx=m?+m[1]:0, dy=m?+m[2]:0;
    if(Math.abs(dx)+Math.abs(dy)>2){
      selNode=d.id;
      humanOp(`move ${curAb().id} ${d.id} ${Math.max(0,Math.round(d.origX+dx))} ${Math.max(0,Math.round(d.origY+dy))}`);
    }
  }else{
    select(d.id);
  }
});
$('canvas').addEventListener('click',e=>{
  if(!e.target.closest('g[id^="n_"]'))select(null);
});
window.addEventListener('keydown',e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||'');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!inField){e.preventDefault();undo();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&!inField&&selNode){
    e.preventDefault();

  }
});

function renderLayers(){
  const box=$('layers');const ab=curAb();
  if(!ab||!(ab.nodes||[]).length){box.innerHTML='<div class="empty-insp" style="padding:6px 8px">（无节点）</div>';return;}

function renderProps(){
  const box=$('props');const n=selNode?nodeOf(selNode):null;
  if(!n){box.innerHTML='<div class="empty-insp">在画布中点击元素选中<br>拖拽移动 · 右侧改属性<br>Del 删除 · ⌘Z 撤销</div>';return;}
  const fill=n.style&&n.style.fill&&n.style.fill!=='none'?n.style.fill:'#ffffff';
  const hex=/^#[0-9a-fA-F]{6}$/.test(fill)?fill:'#ffffff';
  box.innerHTML=`
    <div class="pcard">
      <div class="pid">${n.id}</div>
      <div class="pkind">${n.kind||''}${n.component?' · '+n.component:''}</div>
      <div class="prow"><label>X/Y</label><input type="number" id="pv-x" value="${Math.round(n.rect.x)}"><input type="number" id="pv-y" value="${Math.round(n.rect.y)}"></div>
      <div class="prow"><label>W/H</label><input type="number" id="pv-w" value="${Math.round(n.rect.w)}"><input type="number" id="pv-h" value="${Math.round(n.rect.h)}"></div>
      <div class="prow3"><label>填充</label><span class="colorpair"><input type="color" id="pv-fill-c" value="${hex}"><input type="text" id="pv-fill" value="${fill}"></span></div>
      <div class="prow3"><label>文本</label><input type="text" id="pv-text" value="${(n.text||'').replace(/"/g,'&quot;')}"></div>
      <div class="pbtns">
        <button onclick="centerH()">居中↔</button><button onclick="centerV()">居中↕</button>
        <button onclick="hideNode()" class="danger">隐藏</button><button onclick="delNode()" class="danger">删除</button>
      </div>
    </div>`;
  const commit=(op)=>humanOp(op);
  const numCommit=()=>{
    const x=+$('pv-x').value,y=+$('pv-y').value;
    if(Number.isFinite(x)&&Number.isFinite(y)&&(x!==Math.round(n.rect.x)||y!==Math.round(n.rect.y)))
      commit(`move ${curAb().id} ${n.id} ${x} ${y}`);
  };
  ['pv-x','pv-y'].forEach(id=>$(id).addEventListener('change',numCommit));
  ['pv-w','pv-h'].forEach(id=>$(id).addEventListener('change',()=>{
    const v=+$(id).value;if(!Number.isFinite(v))return;
    const key=id==='pv-w'?'w':'h';
    if(v!==Math.round(key==='w'?n.rect.w:n.rect.h))commit(`update ${curAb().id} ${n.id} ${key}=${v}`);
  }));
  const fc=$('pv-fill-c'),ft=$('pv-fill');
  if(fc&&ft){fc.oninput=()=>{ft.value=fc.value;};ft.addEventListener('change',()=>commit(`update ${curAb().id} ${n.id} fill=${ft.value}`));}
  $('pv-text').addEventListener('change',()=>commit(`update ${curAb().id} ${n.id} text=${JSON.stringify($('pv-text').value)}`));
}
window.centerH=()=>{const n=nodeOf(selNode);if(n&&curAb())humanOp(`move ${curAb().id} ${selNode} ${Math.max(0,Math.round((curAb().width-n.rect.w)/2))} ${Math.round(n.rect.y)}`);};
window.centerV=()=>{const n=nodeOf(selNode);if(n&&curAb())humanOp(`move ${curAb().id} ${selNode} ${Math.round(n.rect.x)} ${Math.max(0,Math.round((curAb().height-n.rect.h)/2))}`);};

  const r=engine.exportHtml(mbt);
  if(r.ok!==true){setStatus(false,r.error||'导出失败');return;}
  const blob=new Blob([r.html],{type:'text/html'});
  const el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download='moonviz-prototype.html';el.click();
  URL.revokeObjectURL(el.href);
  setStatus(true,`✓ HTML 原型已导出（${(r.html.length/1024).toFixed(1)}KB · 节点级交互内置）`);
}
async function loadTemplates(){
  try{
    const arr=JSON.parse(engine.list_templates());
    $('tpl').innerHTML='<option value="">📐 从模板新建…</option>'+
      arr.map(x=>`<option value="${x.id}">${x.name}（${x.id}）</option>`).join('');
  }catch(_){$('tpl').innerHTML='<option value="">模板不可用</option>';}
}
$('tpl').addEventListener('change',e=>{
  const id=e.target.value;if(!id)return;
  // 保留所选：下拉停在刚选的模板上，让用户看得到自己选了什么
  try{
    // 选哪个模板就显示哪个：从空白存根新建整份文档（替换而非累加）。
    // 此前是往现有文档追加画板，画布会堆出 1+N 个画板——所见非所选。
    pushHistory();
    let base=MINIMAL;
    // 画板以模板 id 命名（唯一）：重名会让新模板节点叠进旧画板，
    // 节点重叠触发 AgentGate 拒绝——表现为"选了模板但画布没变"。
    // 模板是引擎作者（人类）设计的制品：AgentGate 拒绝（视觉债）时按
    // HumanGate 载入——这正是双门语义（人类设计带视觉债放行）。
    let r=engine.apply_agent_op(base, `template ${id} ${id}`);
    let via='AgentGate';
    if(r.ok!==true){
      const rh=engine.apply_human_op(base, `template ${id} ${id}`);
      if(rh.ok===true&&rh.mbt){r=rh;via='HumanGate（视觉债 '+rh.debt+'）';}
      else{setStatus(false,r.error||rh.error||'模板载入失败');return;}
    }
    let doc=r.mbt;
    // 存根清理与载入同门：带视觉债的文档经 AgentGate 会被整体拒绝，
    // 删空画板本身无风险，统一走 HumanGate。
    const abs=(r.artboards||[]).filter(a=>(a.nodes||[]).length===0).map(a=>a.id);
    for(const dead of abs){
      const r2=engine.apply_human_op(doc, `delete-artboard ${dead}`);
      if(r2.ok===true&&r2.mbt)doc=r2.mbt;
    }
    mbt=doc;setSrc(mbt);selNode=null;
    const all=(JSON.parse(engine.render(mbt)).artboards||[]);
    artIndex=Math.max(0,all.findIndex(a=>a.id===id));
    selNode=null;
    render();
    const name=$('tpl').selectedOptions[0]?$('tpl').selectedOptions[0].textContent.split('（')[0]:id;
    setStatus(true,`已载入：${name} → 画板 ${id}（${curAb()?Math.round(curAb().width)+'×'+Math.round(curAb().height):''}，经${via}）— 点击元素可拖拽`);
  }catch(err){setStatus(false,String(err.message||err));}
});

/* ---------- 引擎特点展示：债仪表 / 播放模式 / 双门重试 / 主题 / 断点 ---------- */
function updateDebt(){
  const d=$('debt');if(!d)return;const n=(lastResult&&lastResult.debt)||0;
  d.className='debt '+(n>0?'some':'zero');
  d.textContent='债 '+n;
  d.title=n>0?'视觉债 '+n+' 条：引擎容忍但 AgentGate 不放行。点击运行 fix 自动修复':'零视觉债：文档完全合规';
  d.onclick=n>0?()=>fixDebt():null;
}
function fixDebt(){
  const ab=curAb();if(!ab)return;
  if(humanOp(`fix ${ab.id}`,true))setStatus(true,'🔧 fix 已自动修复视觉债（HumanGate：违规严格下降才提交）');
}
let lastRejectedOp=null;
function retryHuman(){
  if(!lastRejectedOp)return;
  const op=lastRejectedOp;lastRejectedOp=null;$('retryBtn').classList.remove('show');
  pushHistory();
  try{
    const r=engine.apply_human_op(mbt,op);
    logOp(op,r);
    if(r.ok===true&&r.mbt){mbt=r.mbt;setSrc(mbt);render();$('ops').value='';
      setStatus(true,`同一操作经 HumanGate 通过（视觉债 ${r.debt}）——双门对比完成`);}
    else{history.pop();setStatus(false,'HumanGate 也拒绝：'+(r.error||''));}
  }catch(e){history.pop();setStatus(false,String(e.message||e));}
}

/* ---------- 原型模式：Axure/墨刀式玩家（交互常驻，源码是二级视图） ---------- */
function setMode(m){
  mode=m;document.body.className='mode-'+m;
  document.querySelectorAll('#modesw button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(!artboards().length){render();return;}
  artIndex=Math.max(0,Math.min(artIndex,artboards().length-1));
  if(mode==='proto'){
    navStack=[curAb()?curAb().id:artboards()[0].id];
    if(selNode)select(null);
  }
  render();
}
function renderStage(){
  const st=$('stage');st.innerHTML='';
  const abs=artboards();
  if(!abs.length){st.innerHTML='<p class="stage-empty">空文档 — 在源码模式或用上方「从模板新建」开始</p>';updatePills();return;}
  const a=abs[Math.min(artIndex,abs.length-1)]||abs[0];
  const d=document.createElement('div');d.className='shot dev on';
  const phone=a.width>=320&&a.height>=560&&(a.height/a.width)>=1.35;
  const browser=a.width>=560&&(a.width/a.height)>=1.15;
  d.innerHTML=`<div class="dframe ${phone?'dphone':browser?'dbrowser':''}">${
    phone?'<span class="island"></span>':
    browser?`<span class="chrome"><i></i><i></i><i></i><em>${a.id}</em></span>`:''
  }${a.svg}</div><button class="tag">${a.id} · ${a.width}×${a.height}</button>`;
  st.appendChild(d);
  // Axure 式：画板上任何元素可点，绑定来自引擎 flows + ⚡标记
  d.querySelectorAll('g[id^="n_"]').forEach(g=>{
    g.addEventListener('click',ev=>{ev.stopPropagation();playTap(g.id.slice(2));});
  });
  applyZoom();updatePills();
}
function updatePills(){
  const bar=$('ab-pills');if(!bar)return;
  bar.innerHTML=artboards().map((a,i)=>`<button data-i="${i}" class="${i===artIndex?'on':''}">${a.id}</button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    artIndex=+b.dataset.i;navStack=[artboards()[artIndex].id];render();
  });
  const back=$('proto-back');if(back)back.disabled=navStack.length<2;
}

/* ---------- 播放模式：交互运行时（引擎的 flows + 标记交互）---------- */
let playing=false,navStack=[];
function togglePlay(){playing?exitPlay():enterPlay();}
function enterPlay(){
  if(!artboards().length){setStatus(false,'先载入内容再演示');return;}
  playing=true;navStack=[curAb()?curAb().id:artboards()[0].id];
  $('playbar').classList.add('on');$('playBtn').textContent='✕ 退出';
  if(selNode)select(null);
  artIndex=artboards().findIndex(a=>a.id===navStack[0]);if(artIndex<0)artIndex=0;
  render();updateNavCrumb();setStatus(null,'演示模式：点击元素触发交互');
}
function exitPlay(){
  playing=false;navStack=[];
  $('playbar').classList.remove('on');$('playBtn').textContent='▶ 演示';
  render();
}
window.exitPlay=exitPlay;
function updateNavCrumb(){
  const nc=$('navcrumb');if(!nc)return;nc.textContent=navStack.length>1?('⟵ '+navStack.slice(0,-1).join(' / ')):'首页层';
}
function showToast(msg){
  const t=$('toast');if(t){t.textContent=msg;t.classList.add('show');}
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}
/* 从 canonical 名字标记解析交互（⚡trigger→action，到 [state: 为止） */
function parseMarker(name){
  const i=name.indexOf('⚡');if(i<0)return null;
  let rest=name.slice(i+1);
  const j=rest.indexOf('[state:');if(j>=0)rest=rest.slice(0,j);
  rest=rest.trim();
  const k=rest.indexOf('→');if(k<0)return null;
  return{trigger:rest.slice(0,k),action:rest.slice(k+1)};
}
function playTap(nodeId){
  const ab=curAb();if(!ab)return;
  // 1) 标记交互优先
  const n=ab.nodes.find(x=>x.id===nodeId);
  if(n&&n.name){
    const mk=parseMarker(n.name);
    if(mk&&mk.trigger==='tap'){execAction(mk.action);return;}
  }
  // 2) flow 边（tap:node）
  const fl=(lastResult&&lastResult.flows||[]).find(f=>f.from===ab.id&&f.trigger==='tap:'+nodeId);
  if(fl){gotoArtboard(fl.to);return;}
  setStatus(null,'点击了 '+nodeId+'（无绑定交互）');
}
function gotoArtboard(id){
  const idx=artboards().findIndex(a=>a.id===id);
  if(idx<0){setStatus(false,'navigate_to: 画板 '+id+' 不存在');return;}
  navStack.push(id);artIndex=idx;render();updateNavCrumb();
}
function execAction(spec){
  const m=/^(\w+)(?::(.*))?$/.exec(spec);
  if(!m)return;
  const[,kind,arg]=m;
  switch(kind){
    case 'navigate_to':gotoArtboard(arg);break;
    case 'show_toast':showToast(arg.replace(/^"|"$/g,''));break;
    case 'back':if(navStack.length>1){navStack.pop();artIndex=artboards().findIndex(a=>a.id===navStack[navStack.length-1]);render();updateNavCrumb();}break;
    case 'set_state':{
      const p=arg.split(':');
      if(humanOp('set-state '+p[0]+' '+p[1],true))showToast('状态 → '+p[1]);
      break;}
    case 'toggle_state':{
      const p=arg.split(':');
      if(humanOp('set-state '+p[0]+' '+(p[1]||'pressed')+' toggle',true))showToast('状态切换');
      break;}
    case 'set_text':{
      const ci=arg.indexOf(':');
      if(ci>0&&humanOp('update '+curAb().id+' '+arg.slice(0,ci)+' text="'+arg.slice(ci+1)+'"',true))setStatus(null,'文字已更新');
      break;}
    case 'haptic':showToast('📳 触觉反馈');break;
    default:showToast(spec);
  }
}
/* 播放模式下画布点击走 playTap 而非选中 */
document.addEventListener('keydown',e=>{
  if(!playing&&mode!=='proto')return;
  if(e.key==='Escape'){
    e.preventDefault();
    if(navStack.length>1)execAction('back');else if(playing)exitPlay();
  }
});

/* ---------- 主题 chips ---------- */
const THEMES=[
  ['light','#ffffff'],['dark','#1b1d21'],['high_contrast','#000000'],
  ['sepia','#f5ecd9'],['nord','#2e3440'],['sunset','#ff9e7d'],
];
document.querySelectorAll('#modesw button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('themes').innerHTML=THEMES.map(([n,c])=>
  '<button data-t="'+n+'" title="theme '+n+'" style="background:'+c+'"></button>').join('');
$('themes').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(humanOp('theme '+b.dataset.t,true)){
    setStatus(true,'主题 → '+b.dataset.t+'（全局设计令牌即时切换 · 角色重着色）');
    const on=document.querySelector('.shot.on');
    if(on){on.classList.add('themed');setTimeout(()=>on.classList.remove('themed'),780);}
  }
});

/* ---------- 响应式断点切换 ---------- */
function bpVariants(){
  const ab=curAb();if(!ab)return [];
  const base=ab.id.replace(/_(tablet|desktop)$/,'');
  return artboards().filter(a=>a.id===base||a.id===base+'_tablet'||a.id===base+'_desktop');
}
function renderBpSwitch(){
  const old=$('bpsw');if(old)old.remove();
  const vs=bpVariants();
  if(vs.length<2)return;
  const bar=$('playbar');
  const sw=document.createElement('span');sw.className='bpsw';sw.id='bpsw';
  sw.style.marginLeft='8px';
  sw.innerHTML=vs.map(a=>{
    const bp=a.id.endsWith('_tablet')?'平板':a.id.endsWith('_desktop')?'桌面':'手机';
    return '<button data-i="'+artboards().indexOf(a)+'" class="'+(a.id===curAb().id?'on':'')+'">'+bp+'</button>';
  }).join('');
  sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{artIndex=+b.dataset.i;render();});
  bar.appendChild(sw);
}

/* ---------- render() 增强：债仪表 / 播放态 / 断点 ---------- */
const _render_orig=render;
render=function(){
  _render_orig();
  updateDebt();renderBpSwitch();
  if(playing){
    const shot=document.querySelector('.shot.on');
    if(shot)shot.classList.add('playing');
  }
};
/* 画布点击在播放模式下改道 */
$('canvas').addEventListener('click',e=>{
  if(!playing)return;
  const g=e.target.closest&&e.target.closest('g[id^="n_"]');
  if(g){e.stopPropagation();playTap(g.id.slice(2));}
},true);

/* Agent 拒绝时提供 HumanGate 重试入口 */
const _applyOp_orig=applyOp;
applyOp=function(){
  const op=$('ops').value.trim();if(!op)return;
  try{
    const r=engine.apply_agent_op(mbt,op);
    logOp(op,r);
    if(r.ok===true&&r.mbt){pushHistory();mbt=r.mbt;setSrc(mbt);artIndex=0;render();$('ops').value='';$('retryBtn').classList.remove('show');lastRejectedOp=null;}
    else{
      const err=r.error||'';
      lastRejectedOp=op;
      $('retryBtn').classList.toggle('show',err.includes('mbt_gate_block'));
      let hint='';
      if(err.includes('unknown_artboard')||err.includes('unknown_node'))hint=' — 请用上方芯片里的真实 id';
      else if(err.includes('mbt_gate_block'))hint=' — AgentGate 硬门槛：点击「HumanGate 重试」看同一操作在人类门下的行为';
      setStatus(false,err+hint);
    }
  }catch(e){setStatus(false,String(e.message||e));}
};

async function boot(){
  if(!(typeof WebAssembly==='object')||!WebAssembly.instantiate){
    $('bootlayer').classList.add('off');document.body.innerHTML='<div class="nosupport">此浏览器不支持 WebAssembly。</div>';return;
  }
  try{
    const res=await fetch('assets/moonviz.wasm');
    if(!res.ok)throw new Error('moonviz.wasm 加载失败（HTTP '+res.status+'）');
    const bytes=await res.arrayBuffer();
    const mod=new WebAssembly.Module(bytes,{builtins:['js-string'],importedStringConstants:'_'});
    const exports=new WebAssembly.Instance(mod,{}).exports;
    engine={
      version:()=>JSON.parse(exports.version_info()),
      render:s=>JSON.parse(exports.render_mbt(s)),
      validate:s=>JSON.parse(exports.validate_mbt(s)),
      apply_agent_op:(s,o)=>JSON.parse(exports.apply_agent_op(s,o)),
      apply_human_op:(s,o)=>JSON.parse(exports.apply_human_op(s,o)),
      list_templates:()=>exports.list_templates(),
    };
    const v=engine.version();
    $('ver').textContent='engine '+v.engine+' v'+v.version+' · wasm-gc · 全程本地运行';
    const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
    $('render-btn').textContent='渲染 '+(isMac?'⌘↵':'Ctrl↵');
    mbt=EXAMPLE;setSrc(mbt);
    await loadTemplates();
    render();
    setStatus(null,mode==='proto'?'就绪 — 原型模式：点击元素触发交互，「源码」进入编辑':'就绪 — 点击画布元素选中，拖拽移动（HumanGate）；操作台体验 Agent 硬门槛');
    $('bootlayer').classList.add('off');
  }catch(e){
    const m=String(e.message||e);
    if(m.includes('js-string')||m.includes('string constants')||m.includes('Import #0')){
      $('bootlayer').classList.add('off');document.body.innerHTML='<div class="nosupport">此浏览器/运行时尚不支持 WASM GC 与 JS String Builtins。<br>请使用 Chrome 119+ / Firefox 120+ / Safari 18.2+ / Edge 119+。</div>';
    }else{
      $('bootlayer').classList.add('off');document.body.innerHTML='<div class="nosupport">引擎加载失败：'+m+'</div>';
    }
  }
}
window.showTab=showTab;window.applySource=applySource;window.validate=validate;
window.downloadSvg=downloadSvg;window.undo=undo;
window.togglePlay=togglePlay;window.retryHuman=retryHuman;window.fixDebt=fixDebt;
window.zoomBy=zoomBy;window.zoomFit=zoomFit;window.setMode=setMode;
boot();
</script>
